[tool.poetry]
name = "wavecore"
version = "1.0.0-alpha60"
description = "Workflow Automation and Validation Engine - Backend"
readme = "README.md"
license = "MIT"
packages = [{include = "wavecore"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pyyaml = "^6.0.2"
python-multipart = "^0.0.12"
websockets = "^14.1"
aiofiles = "^24.1.0"
packaging = "^24.0"
lxml = "^6.0.2"
asyncssh = {version = "^2.21.1", extras = ["bcrypt"]}
httpx = "^0.28.0"
psutil = "^7.1.3"
email-validator = "^2.3.0"
croniter = "^6.0.0"
jsonpath-ng = "^1.8.0"
cryptography = "^46.0.3"
mcp = ">=2,<3"
tlslite-ng = "0.8.2"
ecdsa = "^0.19.2"
certifi = "^2026.6.17"
six = "^1.17.0"
openpyxl = "^3.1.5"
jedi = "^0.20.0"
pg8000 = "==1.31.5"
pymysql = "==1.2.3"
python-tds = "==1.17.1"
oracledb = "==26.0.1"
apsw = "==3.53.4.0"
pyopenssl = "==26.2.0"
sqlglot = "==30.19.0"
asn1crypto = "==1.5.1"
ruamel-yaml = "^0.18"
zxcvbn = "^4.5"
regex = "^2026.9.29"

[tool.poetry.scripts]
wave-new-secret-key = "wavecore.core.secrets.key_provider:print_new_secret_key"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
mypy = "^1.13.0"
black = "^24.10.0"
ruff = "^0.8.2"
types-pyyaml = "^6.0.12.20250915"
lxml-stubs = "^0.5.1"
pytest-timeout = "^2.4.0"
pytest-xdist = "^3.8.0"
types-psutil = "^7.1.1.20251122"
types-croniter = "^6.0.0.20250809"
types-aiofiles = "^25.1.0.20251011"
types-six = "^1.17.0.20260518"
types-openpyxl = "^3.1.5.20260724"
types-pymysql = "^1.2.0.20260807"
types-zxcvbn = "^4.5.0.20260518"
types-regex = "^2026.9.29.20261005"
typos = "1.51.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Coverage disabled by default due to pytest-cov memory issues with large async test suites
addopts = [
    "-v",
    # Disable cache to avoid MemoryError when serializing 2000+ test node IDs
    "-p", "no:cacheprovider"
]
# Filter known benign warnings from Python 3.12 asyncio subprocess cleanup
filterwarnings = [
    "ignore:Exception ignored in.*BaseSubprocessTransport:pytest.PytestUnraisableExceptionWarning"
]

[tool.coverage.run]
data_file = ".coverage/.coverage"
parallel = true
source = ["wavecore"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PLW1514",  # unspecified-encoding (preview)
]
ignore = []

# Carried verbatim to Python 3.10 hosts; tests/core/remote_exec/_vendorability.py enforces it.
[tool.ruff.lint.per-file-ignores]
"wavecore/connectivity/k8s/**/*.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/helm/**/*.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/tls_capabilities.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/http_tls.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_file_ops.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_netcat_core.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_ping_core.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_ports.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/sql/**/*.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_sql_core.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_tls_material.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/opensearch/**/*.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/tls_context.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_held_run.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_opensearch_core.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/trust_store.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/run_log.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/proxy.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/connectivity/web_address.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]
"wavecore/plugins/_user_patterns.py" = ["UP017", "UP036", "UP041", "UP042", "UP043"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
strict = true

[[tool.mypy.overrides]]
module = "jsonpath_ng.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiofiles"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tlslite.*", "ecdsa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jedi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pg8000", "pg8000.dbapi", "pytds", "pytds.tls", "asn1crypto", "asn1crypto.x509"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
