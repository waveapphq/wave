test:
  name: Recipe Example - Secrets, Profiles, Remote
  description: Declare a secret variable, bind a credential profile, and run blocks on a remote host
  tags: [example, secrets]
variables:
  api_token: {type: string, secret: true, value: example-token-123}   # provided inline
  deploy_key: {type: string, secret: true, value_from_file: "deploy-key"}  # sealed from a server-side file
  ssh_session: {type: string, value: main}
flow:
  - block: http-client
    label: Authenticated fetch
    settings:
      url: "http://blackbox.local/private"
      method: GET
      headers: {expr: "{'Authorization': 'Bearer ' + api_token}"}
    profiles:
      - profile: staging-creds
        alias: cred
        fields: [username, password]
    capture: {status_code: private_status}
  - remote:
      settings: {session_id: {expr: "ssh_session"}}
      body:
        - block: file-io
          label: Read the host OS release
          settings: {operation: read, path: /etc/os-release}
          capture: {content: remote_os}
      capture: {remote_session_id: rsid}
  - block: log
    settings: {message: "Remote OS: {{ remote_os }}"}
