test:
  name: Recipe Example - Files and Test Data
  description: Read examples/customers.csv from the test's own Test Data (place it there first with write_testdata), parse it, assert it has rows, write a report into the run's artifacts and log the count
  tags: [example, files]
variables:
  customers_csv: {type: string}      # declared empty; the Read capture fills it
  customer_count: {type: integer}    # declared empty; the CSV Parser capture fills it
flow:
  - block: file-io
    label: Read the fixture
    settings:
      operation: read
      path: testdata://examples/customers.csv   # the test's own files, read-only
    capture:
      content: customers_csv
  - block: csv-parser
    label: Parse the rows
    settings:
      operation: parse
      csv_content: {expr: "customers_csv"}
      has_header: true
    capture:
      row_count: customer_count
  - assert:
      that:
        - "customer_count > 0"
      fail_current_scope: true
  - block: file-io
    label: Write the report
    settings:
      operation: write
      path: artifact://reports/customers.json   # the run's outputs; missing folders are created
      content: '{"customers": {{ customer_count }}}'
  - block: log
    settings:
      message: "Parsed {{ customer_count }} customers from testdata://examples/customers.csv into artifact://reports/customers.json"
      level: INFO
