test:
  name: Recipe Example - JSON Parser in Individual mode
  description: Parse a JSON document with two queries in Individual mode, capture each query into the variable of its own name and check the typed values
  tags: [example, parsers]
variables:
  order_id: {type: integer}
  status: {type: string}
flow:
  - block: json-parser
    label: Read the order
    settings:
      json_content: '{"order": {"id": 1042, "status": "shipped"}}'
      queries:
        order_id: "$.order.id"
        status: "$.order.status"
      output_mode: individual
      query_output_types: {order_id: integer, status: string}
    capture: {order_id: order_id, status: status}
  - assert:
      that: ["order_id == 1042", "status == 'shipped'"]
      fail_current_scope: true
  - block: log
    settings: {message: "Order {{ order_id }} is {{ status }}"}
