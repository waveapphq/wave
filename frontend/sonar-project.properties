sonar.projectKey=wave-frontend
sonar.projectName=WAVE Frontend
sonar.projectVersion=1.0.0-alpha60

sonar.host.url=${SONAR_URL}
sonar.token=${SONAR_TOKEN}

# Sources
sonar.sources=src
sonar.tests=tests

# TypeScript/JavaScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Disable CSS analysis (Tailwind v4 directives cause false positives)
sonar.css.file.suffixes=DO_NOT_ANALYZE

# Exclude from copy-paste detection:
# - Pure data files (repetitive data declarations are not code duplication)
# - Structurally similar but domain-specific components (tables, editors, pages)
#   that share patterns but serve different entity types with different columns/logic

# Coverage exclusions - sync with vitest coverage.exclude in vite.config.ts
# Categories: type-only, SSR, vendored UI, barrels
sonar.coverage.exclusions=\
  src/app/main.tsx,\
  src/vite-env.d.ts,\
  **/*.d.ts,\
  src/types/**,\
  src/lib/api/tests/types.ts,\
  src/services/websocket-client/types.ts,\
  src/services/websocket-client/events.ts,\
  src/services/api-client/types.ts,\
  src/features/workbench/common/element-config/types.ts,\
  src/features/workbench/common/editors/text-editor-modal/types.ts,\
  src/features/workbench/common/canvas/workflow-node/types.ts,\
  src/features/workbench/common/canvas/canvas-action-bar/types.ts,\
  src/features/workbench/common/test-form/types.ts,\
  src/features/workbench/lib/ast-visitor/types.ts,\
  src/features/workbench/lib/expression-validation/types.ts,\
  src/lib/ssr.ts,\
  src/components/ui/command.tsx,\
  src/components/ui/dialog.tsx,\
  src/components/ui/radio-group.tsx,\
  src/components/ui/scroll-area.tsx,\
  src/components/ui/select.tsx,\
  src/components/ui/sheet.tsx,\
  src/components/ui/sidebar.tsx,\
  src/features/dashboard/components/index.ts

# Encoding
sonar.sourceEncoding=UTF-8
