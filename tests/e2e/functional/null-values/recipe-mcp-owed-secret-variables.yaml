test:
  name: Null MCP Owed Secrets
  description: A declare-empty secret a capture fills is not owed; an uncaptured one is
variables:
  owed_token: {type: string, secret: true}
  captured_token: {type: string, secret: true}
  try_token: {type: string, secret: true}
flow:
  - block: shell-exec
    label: Issue captured token
    settings: {command: "printf filled-by-capture"}
    capture: {stdout: captured_token}
  - try:
      label: Guarded issue
      steps:
        - block: shell-exec
          label: Issue try token
          settings: {command: "printf filled-in-try"}
          capture: {stdout: try_token}
  - assert:
      label: Captures filled
      that:
        - "captured_token == 'filled-by-capture'"
        - "try_token == 'filled-in-try'"
      fail_current_scope: true
  - assert:
      label: Owed token given
      that:
        - "owed_token is not None"
      fail_current_scope: true
