# WAVE E2E Kubernetes gateway (test-only): plain-HTTP path-prefix front for the
# published kwok API, so a Connect base URL carries scheme + port + prefix at once.
# Rendered by the image entrypoint: ${NGINX_LOCAL_RESOLVERS} is the compose DNS
# server from /etc/resolv.conf, queried per request so kwok may start later.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name k8s-gateway;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Variable upstream = resolved per request; the rewrite strips the prefix.
    location /k8s/clusters/wave/ {
        set $kwok kwok;
        rewrite ^/k8s/clusters/wave/(.*)$ /$1 break;
        proxy_pass https://$kwok:6443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        return 404;
    }
}
