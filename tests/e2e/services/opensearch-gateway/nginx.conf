# WAVE E2E OpenSearch gateway (test-only): plain-HTTP path-prefix front for the
# opensearch node, so a Cluster URL carries scheme + port + prefix at once.
# Rendered by the image entrypoint: ${NGINX_LOCAL_RESOLVERS} is the compose DNS
# server from /etc/resolv.conf, queried per request so opensearch may start later.

server {
    listen 9478;
    server_name opensearch-gateway;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location = /healthz {
        return 200;
    }

    # The raw request URI tail is passed, so an encoded index pattern (%2A, %2F) arrives unchanged.
    # A named capture: a numbered one ($1) is re-escaped when the request URI holds a %-escape.
    location /os/ {
        set $opensearch opensearch;
        if ($request_uri ~ ^/os(?<os_tail>/.*)$) {
            set $os_path $os_tail;
        }
        proxy_pass https://$opensearch:9200$os_path;
        proxy_ssl_trusted_certificate /etc/nginx/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_name opensearch;
        proxy_ssl_server_name on;
        proxy_set_header Host opensearch;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        return 404;
    }
}
