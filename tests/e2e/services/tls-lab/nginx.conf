# WAVE E2E tls-lab (test-only): seven TLS listeners echoing the negotiated
# protocol/cipher/client-DN as JSON, two chain listeners (leaf + intermediate,
# leaf only), plus two static Helm chart-repository listeners. Port map mirrors
# tests/e2e/services/README.md.
user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 256;
}

http {
  # Access log kept on stdout: specs assert server-side request lines (HTTP/1.1).
  access_log /dev/stdout;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_prefer_server_ciphers off;
  default_type application/json;

  # 9451: mTLS, client cert REQUIRED, TLS 1.0-1.3.
  server {
    listen 9451 ssl;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers DEFAULT@SECLEVEL=0;
    ssl_client_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client on;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"mtls"}';
    }
  }

  # 9452: TLSv1 only.
  server {
    listen 9452 ssl;
    ssl_protocols TLSv1;
    ssl_ciphers DEFAULT@SECLEVEL=0;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"tls10"}';
    }
  }

  # 9453: TLSv1.1 only.
  server {
    listen 9453 ssl;
    ssl_protocols TLSv1.1;
    ssl_ciphers DEFAULT@SECLEVEL=0;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"tls11"}';
    }
  }

  # 9454: TLSv1.2 only (also the container healthcheck endpoint).
  server {
    listen 9454 ssl;
    ssl_protocols TLSv1.2;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"tls12"}';
    }
  }

  # 9455: TLSv1.3 only.
  server {
    listen 9455 ssl;
    ssl_protocols TLSv1.3;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"tls13"}';
    }
  }

  # 9456: TLSv1.2, single pinned cipher.
  server {
    listen 9456 ssl;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"cipher-pin"}';
    }
  }

  # 9457: TLSv1.2, two ciphers, client preference wins.
  server {
    listen 9457 ssl;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    location / {
      return 200 '{"ssl_protocol":"$ssl_protocol","ssl_cipher":"$ssl_cipher","client_dn":"$ssl_client_s_dn","listener":"cipher-reorder"}';
    }
  }

  # 9480: chain leaf (signed by the chain intermediate) sent with the intermediate.
  server {
    listen 9480 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/chain-leaf-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/chain-leaf.key;
    location / {
      return 200 '{"listener":"chain-full"}';
    }
  }

  # 9481: the same chain leaf sent alone, without its intermediate.
  server {
    listen 9481 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/chain-leaf.crt;
    ssl_certificate_key /etc/nginx/certs/chain-leaf.key;
    location / {
      return 200 '{"listener":"chain-leaf-only"}';
    }
  }

  # 9463: Helm chart repository over plain HTTP, no auth.
  server {
    listen 9463;
    root /usr/share/nginx/charts;
    # The http block defaults every response to application/json; charts need their own.
    default_type application/octet-stream;
    types {
      application/gzip tgz;
      application/yaml yaml;
    }
  }

  # 9464: same chart repository over TLS with basic auth (wave / chart-secret).
  server {
    listen 9464 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/charts;
    default_type application/octet-stream;
    types {
      application/gzip tgz;
      application/yaml yaml;
    }
    auth_basic "WAVE chart repository";
    auth_basic_user_file /etc/nginx/chart-htpasswd;
  }
}
