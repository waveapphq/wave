apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wave-demo
  labels:
    app.kubernetes.io/name: wave-demo
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: wave-demo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wave-demo
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        wave.e2e/marker: {{ .Values.marker | quote }}
    spec:
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - name: http
          containerPort: 80
