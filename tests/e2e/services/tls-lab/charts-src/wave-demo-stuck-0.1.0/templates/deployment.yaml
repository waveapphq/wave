apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wave-demo-stuck
  labels:
    app.kubernetes.io/name: wave-demo-stuck
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: wave-demo-stuck
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wave-demo-stuck
        app.kubernetes.io/instance: {{ .Release.Name }}
        wave.e2e/container-creating: "true"
    spec:
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - name: http
          containerPort: 80
