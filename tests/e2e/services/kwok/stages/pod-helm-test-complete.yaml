# Helm test-hook pods (label wave.e2e/helm-test=true) terminate Succeeded with exit 0,
# after pod-ready has taken them to Running. Hook pods are bare Pods, so pod-complete
# cannot serve them: it requires a Job owner reference and kwok ANDs selector
# expressions. Selecting on the label rather than on the helm.sh/hook annotation keeps
# the selector in the matchLabels form the other opt-in Stages use.
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-helm-test-complete
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchLabels:
      wave.e2e/helm-test: "true"
    matchExpressions:
    - key: '.metadata.deletionTimestamp'
      operator: 'DoesNotExist'
    - key: '.status.phase'
      operator: 'In'
      values:
      - 'Running'
  next:
    statusTemplate: |
      {{ $now := Now }}
      containerStatuses:
      {{ range .spec.containers }}
      - image: {{ .image | Quote }}
        name: {{ .name | Quote }}
        ready: false
        restartCount: 0
        started: false
        state:
          terminated:
            exitCode: 0
            finishedAt: {{ $now | Quote }}
            reason: Completed
            startedAt: {{ $now | Quote }}
      {{ end }}
      phase: Succeeded
