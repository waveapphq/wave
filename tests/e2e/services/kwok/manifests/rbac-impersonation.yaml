# Impersonation subjects for the read Blocks' Impersonate-User / Impersonate-Group
# options. No token in tokens.csv maps to either subject, so the ONLY way to act as
# them is an impersonation header; both grants are narrower than the cluster-admin
# caller's, so impersonating changes the outcome of a read. User wave-nobody is
# deliberately NOT seeded: it is the no-rights control.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave-group-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave-reader
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: wave-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave-readers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave-group-reader
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: wave-readers
