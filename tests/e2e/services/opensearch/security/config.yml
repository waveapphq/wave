# WAVE E2E OpenSearch authentication (test-only): client certificate, then the
# HS256 JWT, then internal users over Basic; API tokens on.
_meta:
  type: "config"
  config_version: 2
config:
  dynamic:
    http:
      anonymous_auth_enabled: false
    api_tokens:
      enabled: true
      # Revoked tokens count toward this cap and cannot be deleted; 3.8.0 caps it at 1000.
      max_tokens: 1000
    authc:
      clientcert_auth_domain:
        http_enabled: true
        transport_enabled: false
        order: 1
        http_authenticator:
          type: clientcert
          challenge: false
          config:
            username_attribute: cn
        authentication_backend:
          type: noop
      jwt_auth_domain:
        http_enabled: true
        transport_enabled: false
        order: 2
        http_authenticator:
          type: jwt
          challenge: false
          config:
            # Base64 text of tests/e2e/services/opensearch/jwt/wave-e2e.key.
            signing_key: "eUaWQUYikNjmYSEvwbwdRGbNeVpeht77XuYTrhkeACw="
            jwt_header: "Authorization"
            subject_key: sub
            roles_key: roles
        authentication_backend:
          type: noop
      # Last: a challenging domain that finds no Basic header answers 401 at once, so none after it runs.
      basic_internal_auth_domain:
        http_enabled: true
        transport_enabled: true
        order: 3
        http_authenticator:
          type: basic
          challenge: true
        authentication_backend:
          type: intern
